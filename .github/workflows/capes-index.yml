name: Cape index
on:
  push:
    branches: [main]
    paths:
      - "capes/*.png"
      - "capes/build-index.mjs"
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node capes/build-index.mjs
      - name: Commit the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capes/index.json
          git diff --cached --quiet || (git commit -m "capes: update index" && git push)
